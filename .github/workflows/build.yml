name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build WinTerminalTools.sln -c Release
      - run: dotnet test tests/WinTerminalTools.Tests -c Release
      - run: dotnet publish WinTerminalTools.csproj -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: WinTerminalTools-win-x64
          path: publish/
